<!doctype html>
<html lang="en">
  <head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <div class="container">
      <div
        class="bg-info-subtle"
        style="padding: 20px; margin-top: 20px; border-radius: 10px"
      >
        <h1>Alaura Ward</h1>
        <p>
          This is Alaura's first web page using version control with Git and
          GitHub.
        </p>
        <h2>Oso</h2>
        <p>
          This is Oso, he is a 2 year old goldendoodle that likes car rides and
          playing fetch.
        </p>
        <img
          src="images/oso.jpg"
          alt="Oso"
          style="width: 300px; height: auto; border-radius: 10px"
        />
      </div>
    </div>

    <script>
      // Load only the #site-nav element from navbar.html
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>
  </body>
</html>
